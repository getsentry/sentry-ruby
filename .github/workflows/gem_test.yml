name: Gem Test

# Reusable, gem-agnostic test workflow. tests.yml invokes it once per gem via a
# central matrix, passing the gem dir plus whatever optional service/packages
# that gem needs. The per-cell matrix still comes from each gem's
# test-matrix.json (the single source of truth), expanded here and run via
# bin/test — so adding/removing a cell never touches this file.

on:
  workflow_call:
    inputs:
      gem:
        description: Gem directory to test (e.g. sentry-ruby).
        required: true
        type: string
      sqlite:
        description: Install SQLite development headers.
        type: boolean
        default: false
      imagemagick:
        description: Install ImageMagick.
        type: boolean
        default: false
      postgres:
        description: Start a PostgreSQL service and expose its URL as POSTGRES_URL.
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - id: set
        run: echo "include=$(jq -c . ${{ inputs.gem }}/test-matrix.json)" >> "$GITHUB_OUTPUT"

  # Builds one Bundler download cache (gems, compiled extensions, git checkouts,
  # index) covering every cell of the gem, so test jobs stop re-downloading the
  # same gems. Runs only when the gem's lockfiles change; test jobs don't wait
  # for it and fall back to the previous cache until it's saved.
  gem-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CC: gcc-13
      CXX: g++-13
      BUNDLE_GLOBAL_GEM_CACHE: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check for an existing gem cache
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bundle/cache
          key: bundle-v1-${{ runner.os }}-${{ inputs.gem }}-${{ hashFiles(format('{0}/gemfiles/*.lock', inputs.gem)) }}
          lookup-only: true

      - name: Install apt packages
        if: steps.lookup.outputs.cache-hit != 'true' && inputs.sqlite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libsqlite3-dev

      - name: Set up Ruby
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-mise

      - name: Install every cell's gems
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          for cell in $(ruby bin/test --gem "${{ inputs.gem }}" -l); do
            ruby bin/test --cell "$cell" --install-only
          done

      - name: Save gem cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bundle/cache
          key: ${{ steps.lookup.outputs.cache-primary-key }}

  test:
    needs: matrix
    env:
      CC: gcc-13
      CXX: g++-13
      BUNDLE_GLOBAL_GEM_CACHE: "true"
    defaults:
      run:
        working-directory: ${{ inputs.gem }}
    name: ${{ toJson(matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: ghcr.io/getsentry/image-mirror-library-redis:7.0.8-bullseye
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: ${{ inputs.postgres && 'ghcr.io/getsentry/image-mirror-library-postgres:18-alpine' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sentry_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install apt packages
        if: inputs.sqlite || inputs.imagemagick
        run: |
          sudo apt-get update
          packages=()
          if [[ "${{ inputs.sqlite }}" == "true" ]]; then
            packages+=(libsqlite3-dev)
          fi
          if [[ "${{ inputs.imagemagick }}" == "true" ]]; then
            packages+=(imagemagick)
          fi
          sudo apt-get install --no-install-recommends "${packages[@]}"

      - name: Set up Ruby
        uses: ./.github/actions/setup-mise

      - name: Restore gem cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bundle/cache
          key: bundle-v1-${{ runner.os }}-${{ inputs.gem }}-${{ hashFiles(format('{0}/gemfiles/*.lock', inputs.gem)) }}
          restore-keys: bundle-v1-${{ runner.os }}-${{ inputs.gem }}-

      - name: Run specs
        env:
          MATRIX_ENTRY: ${{ toJson(matrix) }}
          POSTGRES_URL: ${{ inputs.postgres && 'postgres://postgres:postgres@localhost:5432/sentry_test' || '' }}
        run: ruby ../bin/test --entry "$MATRIX_ENTRY" --rake

      - name: Upload Coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
